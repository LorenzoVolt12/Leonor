<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Presentinho :3</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="carta">

        <!-- Carta fechada -->
        <img
            src="Carta%20(fechada).jpg"
            id="envelope"
            alt="Carta fechada"
        >

        <!-- Círculo para abrir -->
        <div
            id="botaoAbrir"
            role="button"
            aria-label="Abrir carta"
        ></div>

        <!-- Mensagem -->
        <div id="mensagem" aria-hidden="true">

            <h1>Para ti, Leonor :3</h1>

            <p>
                Eu fiz este presentinho especialmente para ti. 💗
            </p>

            <p>
                Espero que gostes muito! :D
            </p>

            <p>
                ❤️
            </p>

        </div>

    </div>


    <script>

        const carta = document.getElementById("carta");
        const botao = document.getElementById("botaoAbrir");
        const mensagem = document.getElementById("mensagem");

        let abriu = false;

        botao.addEventListener("click", abrirCarta);

        function abrirCarta() {

            if (abriu) return;

            abriu = true;

            // Começa a animação
            carta.classList.add("abrindo");

            // Depois da animação, mostra a mensagem
            setTimeout(() => {

                mensagem.setAttribute("aria-hidden", "false");

                carta.classList.add("aberta");

            }, 900);

        }

    </script>

</body>
</html>
